<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>

<body>

    <h1>Edit Expense</h1>

    <form method="POST" action="/update/{{ expense[0] }}">

        <label>Title:</label>
        <input
            type="text"
            name="title"
            value="{{ expense[1] }}"
            required
        >

        <br><br>

        <label>Amount:</label>
        <input
            type="number"
            name="amount"
            step="0.01"
            value="{{ expense[2] }}"
            required
        >

        <br><br>

        <label>Category:</label>
        <input
            type="text"
            name="category"
            value="{{ expense[3] }}"
            required
        >

        <br><br>

        <button type="submit">Update Expense</button>

    </form>

    <br>

    <a href="/">
        <button type="button">Back to Expenses</button>
    </a>

</body>
</html>
